spring:
  application:
    name: fragpicker-server
  profiles:
    default: bootstrap
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

fragpicker:
  business-zone: Asia/Shanghai
  integrations:
    parsevideo:
      enabled: ${PARSEVIDEO_ENABLED:false}
      base-url: ${PARSEVIDEO_BASE_URL:}
      connect-timeout: ${PARSEVIDEO_CONNECT_TIMEOUT:5s}
      read-timeout: ${PARSEVIDEO_READ_TIMEOUT:45s}
      max-response-bytes: ${PARSEVIDEO_MAX_RESPONSE_BYTES:1048576}
      username: ${PARSEVIDEO_USERNAME:}
      password: ${PARSEVIDEO_PASSWORD:}
    tingwu:
      app-key: ${TINGWU_APP_KEY:}
    oss:
      bucket: ${OSS_BUCKET:}
      endpoint: ${OSS_ENDPOINT:}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
    chat:
      enabled: ${AI_CHAT_ENABLED:false}
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:}
      model: ${AI_CHAT_MODEL:}
      timeout: ${AI_CHAT_TIMEOUT:60s}
      max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:4096}
