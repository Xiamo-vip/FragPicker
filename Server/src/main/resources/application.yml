spring:
  application:
    name: fragpicker-server
  profiles:
    default: bootstrap
  jackson:
    time-zone: UTC
  task:
    scheduling:
      thread-name-prefix: fragpicker-scheduled-
      pool:
        size: ${SCHEDULER_POOL_SIZE:8}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.aliyun.oss: 'OFF'
    org.apache.http: 'OFF'
    com.aliyun.tea: 'OFF'
    com.aliyun.teaopenapi: 'OFF'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

fragpicker:
  business-zone: Asia/Shanghai
  chat:
    turn:
      timeout: ${CHAT_TURN_TIMEOUT:180s}
      max-concurrent: ${CHAT_MAX_CONCURRENT:2}
  knowledge:
    search:
      max-chunks: ${SEARCH_MAX_CHUNKS:100000}
      timeout: ${SEARCH_TIMEOUT:15s}
      min-similarity: ${SEARCH_MIN_SIMILARITY:0.40}
      literal-boost: ${SEARCH_LITERAL_BOOST:0.10}
    index:
      enabled: ${KNOWLEDGE_INDEX_ENABLED:false}
      poll-delay: ${INDEX_POLL_DELAY:2s}
      lease-duration: ${INDEX_LEASE_DURATION:10m}
      max-attempts: ${INDEX_MAX_ATTEMPTS:3}
      retry-base-delay: ${INDEX_RETRY_BASE_DELAY:10s}
      max-chunks: ${INDEX_MAX_CHUNKS:10000}
    enrichment:
      enabled: ${KNOWLEDGE_ENRICHMENT_ENABLED:false}
      poll-delay: ${KNOWLEDGE_POLL_DELAY:2s}
      lease-duration: ${KNOWLEDGE_LEASE_DURATION:5m}
      max-attempts: ${KNOWLEDGE_MAX_ATTEMPTS:3}
      retry-base-delay: ${KNOWLEDGE_RETRY_BASE_DELAY:10s}
  ingestion:
    transcription-worker:
      enabled: ${TRANSCRIPTION_WORKER_ENABLED:false}
      poll-delay: ${TRANSCRIPTION_POLL_DELAY:2s}
      query-delay: ${TRANSCRIPTION_QUERY_DELAY:1m}
      lease-duration: ${TRANSCRIPTION_LEASE_DURATION:5m}
      max-task-age: ${TRANSCRIPTION_MAX_TASK_AGE:24h}
      max-failures: ${TRANSCRIPTION_MAX_FAILURES:8}
      retry-base-delay: ${TRANSCRIPTION_RETRY_BASE_DELAY:10s}
    media-worker:
      enabled: ${MEDIA_WORKER_ENABLED:false}
      poll-delay: ${MEDIA_WORKER_POLL_DELAY:2s}
      lease-duration: ${MEDIA_WORKER_LEASE_DURATION:30m}
      max-attempts: ${MEDIA_WORKER_MAX_ATTEMPTS:3}
      retry-base-delay: ${MEDIA_WORKER_RETRY_BASE_DELAY:10s}
    worker:
      enabled: ${INGESTION_WORKER_ENABLED:false}
      poll-delay: ${INGESTION_POLL_DELAY:2s}
      lease-duration: ${INGESTION_LEASE_DURATION:5m}
      max-attempts: ${INGESTION_MAX_ATTEMPTS:3}
      retry-base-delay: ${INGESTION_RETRY_BASE_DELAY:10s}
    allowed-hosts: ${INGESTION_ALLOWED_HOSTS:www.acfun.cn,tv.cctv.cn,tv.cctv.com,doupai.cc,v.douyin.com,www.iesdouyin.com,www.douyin.com,haokan.baidu.com,haokan.hao123.com,www.bilibili.com,b23.tv,m.bilibili.com,v.huya.com,v.kuaishou.com,www.pearvideo.com,weibo.cn,meipai.com,h5.pipigx.com,h5.pipix.com,xspshare.baidu.com,kg.qq.com,6.cn,tv.sohu.com,my.tv.sohu.com,weibo.com,isee.weishi.qq.com,v.ixigua.com,www.ixigua.com,xinpianchang.com,share.xiaochuankeji.cn,www.xiaohongshu.com,xhslink.com,xhslink.cn,twitter.com,x.com,t.co,mobile.twitter.com,v.qq.com,m.v.qq.com}
  integrations:
    media:
      temp-directory: ${MEDIA_TEMP_DIR:${java.io.tmpdir}/fragpicker-media}
      max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:1073741824}
      max-cover-bytes: ${MEDIA_MAX_COVER_BYTES:10485760}
      connect-timeout: ${MEDIA_CONNECT_TIMEOUT:5s}
      read-timeout: ${MEDIA_READ_TIMEOUT:30s}
      total-timeout: ${MEDIA_TOTAL_TIMEOUT:5m}
      max-redirects: ${MEDIA_MAX_REDIRECTS:3}
    parsevideo:
      enabled: ${PARSEVIDEO_ENABLED:false}
      base-url: ${PARSEVIDEO_BASE_URL:}
      connect-timeout: ${PARSEVIDEO_CONNECT_TIMEOUT:5s}
      read-timeout: ${PARSEVIDEO_READ_TIMEOUT:45s}
      max-response-bytes: ${PARSEVIDEO_MAX_RESPONSE_BYTES:1048576}
      username: ${PARSEVIDEO_USERNAME:}
      password: ${PARSEVIDEO_PASSWORD:}
    tingwu:
      enabled: ${TINGWU_ENABLED:false}
      app-key: ${TINGWU_APP_KEY:}
      source-language: ${TINGWU_SOURCE_LANGUAGE:auto}
      connect-timeout: ${TINGWU_CONNECT_TIMEOUT:5s}
      read-timeout: ${TINGWU_READ_TIMEOUT:30s}
      result-timeout: ${TINGWU_RESULT_TIMEOUT:60s}
      max-result-bytes: ${TINGWU_MAX_RESULT_BYTES:16777216}
      source-url-ttl: ${TINGWU_SOURCE_URL_TTL:4h}
    oss:
      enabled: ${OSS_ENABLED:false}
      bucket: ${OSS_BUCKET:}
      endpoint: ${OSS_ENDPOINT:}
      max-video-bytes: ${OSS_MAX_VIDEO_BYTES:1073741824}
      max-cover-bytes: ${OSS_MAX_COVER_BYTES:10485760}
      signed-url-ttl: ${OSS_SIGNED_URL_TTL:5m}
    aliyun:
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      security-token: ${ALIBABA_CLOUD_SECURITY_TOKEN:}
    chat:
      enabled: ${AI_CHAT_ENABLED:false}
      base-url: ${AI_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_CHAT_API_KEY:}
      model: ${AI_CHAT_MODEL:}
      timeout: ${AI_CHAT_TIMEOUT:60s}
      max-output-tokens: ${AI_CHAT_MAX_OUTPUT_TOKENS:4096}
